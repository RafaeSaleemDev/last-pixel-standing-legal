<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Last Pixel Standing</title>
  <meta name="description" content="Privacy policy and support for the Last Pixel Standing iOS app.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --card: #1a2740;
      --text: #f9fafb;
      --muted: #b7c0d0;
      --accent: #52e5b5;
      --line: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 720px; margin: 0 auto; padding: 48px 20px 72px; }
    h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 8px; }
    p { color: var(--muted); }
    a { color: var(--accent); }
    ul { padding-left: 1.2rem; }
    li { margin: 0.4rem 0; }
  </style>
</head>
<body>
  <main>
    <h1>Last Pixel Standing</h1>
    <p>Privacy policy and support for the iPhone and iPad game.</p>
    <ul>
      <li><a href="privacy.html">Privacy Policy</a></li>
      <li><a href="support.html">Support</a></li>
    </ul>
  </main>
</body>
</html>
